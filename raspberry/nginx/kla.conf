map $http_cf_connecting_ip $kla_client_key {
    default $http_cf_connecting_ip;
    "" $binary_remote_addr;
}

map $http_cf_connecting_ip $kla_forwarded_ip {
    default $http_cf_connecting_ip;
    "" $remote_addr;
}

# Only state-changing authentication endpoints use the strict limit. Session
# refreshes and MFA status reads stay on the general limit, so normal
# navigation cannot lock a legitimate user out.
map "$request_method:$uri" $kla_sensitive_auth_key {
    default "";
    ~^POST:/api/auth/(sign-in/email|request-password-reset|sign-up/email|two-factor/) $kla_client_key;
}

limit_req_zone $kla_client_key zone=kla_general:10m rate=30r/s;
limit_req_zone $kla_sensitive_auth_key zone=kla_auth:10m rate=12r/m;
limit_req_zone $kla_client_key zone=kla_health:1m rate=5r/s;
limit_conn_zone $kla_client_key zone=kla_connections:10m;

# No query strings, IP addresses, cookies, referrers or user-agent strings.
# Security correlation uses the application-level HMAC pseudonym instead.
log_format kla_privacy '$time_iso8601 request_id=$request_id method=$request_method uri=$uri status=$status bytes=$body_bytes_sent rt=$request_time urt=$upstream_response_time';

server {
    # Production: 127.0.0.1 only, HTTPS terminates in Cloudflare Tunnel.
    # Local demo: LAN port 8080, restricted by UFW to private networks.
    listen __LISTEN__ default_server;
    server_name __SERVER_NAME__;
    client_max_body_size 20m;
    server_tokens off;
    access_log /var/log/nginx/kla-access.log kla_privacy;
    limit_conn kla_connections 24;
    limit_req_status 429;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript application/manifest+json application/xml image/svg+xml text/css text/javascript text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/health {
        limit_req zone=kla_health burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto __FORWARDED_PROTO__;
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
    }

    location ^~ /_next/static/ {
        limit_req zone=kla_general burst=100 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto __FORWARDED_PROTO__;
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location ^~ /api/auth/ {
        limit_req zone=kla_general burst=30 nodelay;
        limit_req zone=kla_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $kla_forwarded_ip;
        proxy_set_header X-Forwarded-For $kla_forwarded_ip;
        proxy_set_header X-Forwarded-Proto __FORWARDED_PROTO__;
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        limit_req zone=kla_general burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $kla_forwarded_ip;
        proxy_set_header X-Forwarded-For $kla_forwarded_ip;
        proxy_set_header X-Forwarded-Proto __FORWARDED_PROTO__;
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
