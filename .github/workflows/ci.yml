name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://edziennik:edziennik@127.0.0.1:5432/edziennik_kla
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Check
        run: npm run check
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
      - name: Validate deployment scripts
        run: |
          bash -n raspberry/install.sh raspberry/update.sh
          bash -n deployment/home-vps/install.sh deployment/home-vps/update.sh
